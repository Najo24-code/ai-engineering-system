name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates-que-no-cuestan-cuota:
    # Solo lo que package.json ya distingue como gratis y determinista:
    # sin esto no hay nada que instalar (cero dependencias) y sin bwrap
    # fallan 5 pruebas de la suite (docs: README.md, sección "Requisitos").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: instalar bubblewrap (el recinto)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: permitir user namespaces sin privilegios (Ubuntu 24.04 los restringe por defecto)
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: DEBUG correrSuiteAislada real
        run: |
          mkdir -p /tmp/fixture-debug/tests
          cd /tmp/fixture-debug && git init -q && git config user.email a@a && git config user.name a
          echo '{"name":"fixture"}' > package.json
          echo 'import test from "node:test"; test("ok", () => {})' > tests/ok.test.js
          git add -A && git commit -q -m base
          cat > /tmp/debug.mjs <<'DEBUGEOF'
          import { correrSuiteAislada } from "/home/runner/work/ai-engineering-system/ai-engineering-system/core/verification/verdict.mjs"
          const r = correrSuiteAislada({ proyecto: "/tmp/fixture-debug" })
          console.log(JSON.stringify(r, null, 2))
          DEBUGEOF
          node /tmp/debug.mjs

      - name: npm test
        run: npm test

      - name: gate:contencion (el recinto, 13 ataques, cuesta cero)
        run: npm run gate:contencion

      - name: sync:check (¿los agentes instalados coinciden con su contrato?)
        run: npm run sync:check
